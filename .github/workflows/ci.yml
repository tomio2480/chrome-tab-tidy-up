name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの連続 push では古い実行を打ち切る．
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit
        # GHSA-mw96-cpmx-2vgc は @crxjs/vite-plugin の rollup 2.79.2 に対する
        # npm advisory 誤検知（タイトル: "Rollup 4 has..." = rollup 4.x 限定の脆弱性）。
        # ビルドツールの依存であり実行時コードには含まれないため critical のみで検出する。
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 成果物の保存は明示的に指示したときだけ行う．
      # 手動実行するか，PR へ build-artifact ラベルを付ける．
      - name: Upload artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'build-artifact'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
